[project]
name = "rock-paper-scissors"
version = "0.1.0"
description = "Rock-Paper-Scissors CLI with pluggable rule sets"
authors = [
    {name = "anarhehest",email = "drevv5@icloud.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "returns (>=0.30.0,<0.31.0)",
    "fastapi (>=0.163.1,<0.164.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.34,<0.0.35)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
rps = "rps.cli:main"
rps-web = "rps.web.app:run"

[tool.poetry]
packages = [{ include = "rps", from = "src" }]

[dependency-groups]
dev = [
    "ruff (>=0.15.16,<0.16.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]